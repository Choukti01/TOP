services:
  postgres:
    image: postgres:17-alpine
    container_name: top-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: top
      POSTGRES_USER: top
      POSTGRES_PASSWORD: top
    ports:
      - "5432:5432"
    volumes:
      - top-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top -d top"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  top-postgres-data:
