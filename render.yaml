services:
  - type: web
    name: top-api
    runtime: node
    rootDir: backend
    plan: free
    # Render builds with NODE_ENV=production. Explicitly retain build-time
    # dependencies such as TypeScript and @types/node for the compile step.
    buildCommand: npm ci --include=dev && npm run build
    # The Free plan does not provide a pre-deploy hook. Drizzle keeps this
    # idempotent, so applying pending migrations before boot makes every
    # deployment safe for an empty production database.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_ENABLED
        value: "true"
      - key: WEB_ORIGIN
        value: https://www.t0p.world
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
